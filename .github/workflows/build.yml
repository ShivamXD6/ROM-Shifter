name: Build ROM-Shifter

on:
  push:
    paths:
      - 'app/src/main/**'
      - 'app/build.gradle.kts'
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Get Version Info & Changelogs
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "COMMIT_COUNT=$COMMIT_COUNT" >> $GITHUB_ENV
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "1.0")
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          CHANGES=$(git log $PREV_TAG..HEAD --pretty=format:"- **%s** by @%an%n%w(0,2,2)%b")
          
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Build ROM Shifter
        run: ./gradlew assembleRelease -PVERSION_CODE=${{ env.COMMIT_COUNT }} -x lintVitalRelease --build-cache --parallel --configuration-cache
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ env.COMMIT_COUNT }}"
          name: "⚡ ROM Shifter - ${{ env.VERSION_NAME }} - ${{ env.COMMIT_COUNT }}"
          body: |
            Automated pre-release build for **${{ env.VERSION_NAME }}** (Build ${{ env.COMMIT_COUNT }}).
            
            ### 🔄 Changes in this build:
            ${{ env.CHANGELOG }}
          prerelease: true
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}